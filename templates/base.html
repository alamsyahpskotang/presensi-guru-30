<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Presensi Kelas{% endblock %}</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/css/style.css">
<meta name="theme-color" content="#0F6E56">
</head>
<body>
<div class="container">
  <div class="nav-bar">
    <button type="button" class="nav-btn" onclick="history.back()">&larr; Kembali</button>
    <a href="/" class="nav-btn">Beranda</a>
    {% if session.get('guru_id') or session.get('kepsek_login') %}
    <a href="/logout" class="nav-btn nav-btn-logout">Keluar</a>
    {% endif %}
  </div>

  <div class="logo-wrap">
    <img src="/static/images/logo-tangerang.png" alt="Logo Kota Tangerang" class="logo-kota">
  </div>

  {% block content %}{% endblock %}

  <footer class="footer-app">designed by Altrade1980</footer>
</div>
</body>
</html>
