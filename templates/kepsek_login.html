{% extends "base.html" %}
{% block title %}Login Kepala Sekolah{% endblock %}
{% block content %}
<h2>Login kepala sekolah</h2>
{% if error %}<p style="color:#a32d2d;">{{ error }}</p>{% endif %}
<form method="POST">
  <label for="pin">PIN kepala sekolah</label>
  <input type="password" id="pin" name="pin" inputmode="numeric" required>
  <button type="submit" class="btn-primary">Masuk</button>
</form>
{% endblock %}
